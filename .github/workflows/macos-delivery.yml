name: macOS delivery

on:
  push:
    branches: ['codex/macos-*']
    paths:
      - .github/workflows/macos-delivery.yml
      - tools/macos/**
      - tools/release/release-signing.pub
      - tools/release/embed_keys.sh
      - tools/required_test_report.py
      - tools/tests/test_macos_toolkit.py
      - tools/tests/test_swift_package_resolve.py
      - tools/tests/test_swift_cache_provision.py
  pull_request:
    paths:
      - .github/workflows/macos-delivery.yml
      - tools/macos/**
      - tools/release/release-signing.pub
      - tools/release/embed_keys.sh
      - tools/required_test_report.py
      - tools/tests/test_macos_toolkit.py
      - tools/tests/test_swift_package_resolve.py
      - tools/tests/test_swift_cache_provision.py
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: macos-delivery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  toolkit-contracts:
    name: Toolkit fingerprint and manifest regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BASELINE_REVISION: 1843cb570735e6efa3c8843ef80a98af662a4dda
    steps:
      - name: Check out tested revision and baseline history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Verify dependency acquisition recovery
        run: |
          mkdir -p diagnostics
          python3 -m unittest tools.tests.test_swift_package_resolve tools.tests.test_swift_cache_provision -v 2>&1 | tee diagnostics/dependency-recovery-tests.log
      - name: Require baseline reproductions and every candidate toolkit test
        run: |
          mkdir -p diagnostics
          python3 - <<'PY' 2>&1 | tee diagnostics/toolkit-tests.log
          import hashlib
          import json
          import os
          from pathlib import Path
          import platform
          import subprocess
          import unittest
          from tools.tests import test_macos_toolkit as tests

          baseline = os.environ["BASELINE_REVISION"]
          revision = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if revision != os.environ["GITHUB_SHA"]:
              raise SystemExit("the checkout does not match the triggering revision")
          original = tests.LAYOUT
          blob = subprocess.check_output(["git", "show", baseline + ":tools/macos/toolkit_layout.sh"])
          previous = Path(os.environ["RUNNER_TEMP"]) / "toolkit-baseline/tools/macos/toolkit_layout.sh"
          previous.parent.mkdir(parents=True)
          previous.write_bytes(blob)
          names = ["test_make_toolkit_uses_the_complete_fingerprint",
                   "test_manifest_rejects_file_and_directory_links_before_replacing_output",
                   "test_manifest_does_not_follow_an_existing_manifest_link"]
          markers = ["self.assertNotEqual((output / \"version.txt\").read_text(), original)",
                     "AssertionError: 0 == 0", "AssertionError: 0 == 0"]
          reproductions = []
          tests.LAYOUT = previous
          try:
              for name, marker in zip(names, markers):
                  result = unittest.TextTestRunner(verbosity=2).run(unittest.TestSuite([tests.MacOSToolkitTests(name)]))
                  matched = (result.testsRun == 1 and len(result.failures) == 1 and not result.errors and
                             not result.skipped and not result.expectedFailures and not result.unexpectedSuccesses and
                             result.failures[0][0]._testMethodName == name and marker in result.failures[0][1])
                  reproductions.append({"test": name, "required_failure": marker, "reproduced": matched})
          finally:
              tests.LAYOUT = original
          suite = unittest.defaultTestLoader.loadTestsFromTestCase(tests.MacOSToolkitTests)
          registered = suite.countTestCases()
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          passed = (registered == 11 and result.testsRun == registered and result.wasSuccessful() and
                    not result.skipped and not result.expectedFailures and not result.unexpectedSuccesses)
          data = {"revision": revision, "baseline_revision": baseline, "host": platform.platform(),
                  "python": platform.python_version(), "baseline_producer_sha256": hashlib.sha256(blob).hexdigest(),
                  "candidate_producer_sha256": hashlib.sha256(original.read_bytes()).hexdigest(),
                  "test_source_sha256": hashlib.sha256(Path(tests.__file__).read_bytes()).hexdigest(),
                  "baseline_reproductions": reproductions, "registered": registered, "executed": result.testsRun,
                  "failures": len(result.failures), "errors": len(result.errors), "skipped": len(result.skipped),
                  "passed": passed and all(item["reproduced"] for item in reproductions)}
          Path("diagnostics/toolkit-report.json").write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"### Toolkit contracts\n\nBaseline regressions reproduced: {sum(item['reproduced'] for item in reproductions)}/3. Candidate tests: {result.testsRun}; failures: {len(result.failures)}; errors: {len(result.errors)}; skips: {len(result.skipped)}.\n")
          if not data["passed"]:
              raise SystemExit("the unchanged baseline must reproduce all three defects and all 11 candidate tests must pass")
          PY
      - name: Upload toolkit diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: toolkit-contracts-${{ github.sha }}-${{ github.run_attempt }}
          path: diagnostics/
          retention-days: 7
          if-no-files-found: error

  launcher-contracts:
    name: Engine installation and update contracts
    needs: toolkit-contracts
    runs-on: macos-26
    timeout-minutes: 75
    env:
      PLACEMENT_BASELINE_REVISION: 861424137e7b0b801fa1f86958b486292a268a89
      REQUIRED_SWIFT_SUITES: 'EngineToolkitTests EngineCheckoutTests RelinkInputsTests InstallerRunTests PlaceTests ProfileSavesTests UpdatesTests SignedUpdateTests ReleaseSigningTests GameArchivesTests GameUpdatesTests UpdateChannelTests UpdateChannelLookupTests UpdateLookupTests UpdateDownloadTests ReleaseRepositoryTests InstallationCheckTests IssueDraftTests LanguageFilesTests'
    steps:
      - name: Check out tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Record source and machine identity
        run: |
          mkdir -p diagnostics
          {
            git rev-parse HEAD
            sw_vers
            uname -a
            sysctl hw.model hw.memsize hw.ncpu machdep.cpu.brand_string
            xcodebuild -version
            swift --version
            python3 --version
            printf 'Coverage: launcher, engine installation, archives and updates using synthetic fixtures; no game or GPU validation\n'
          } > diagnostics/identity.txt
          printf '%s\n' 'Not selected: AnyPS5CoreTests.EngineCheckoutTests/testAnEngineFromARealCheckoutsBuild requires ANYPS5_LIVE_CHECKOUT and ANYPS5_LIVE_TOOLKIT pointing at a complete built engine. This job provisions synthetic toolkit contracts and Swift binaries.' \
            > diagnostics/unprovisioned-live-test.txt
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(uname -m)" = arm64
          tools/release/embed_keys.sh --check --swift-only
      - name: Install Rosetta for the universal command-line checks
        run: |
          sudo softwareupdate --install-rosetta --agree-to-license 2>&1 | tee diagnostics/rosetta.log
          test "$(arch -x86_64 uname -m)" = x86_64
      - name: Provision verified archives in a private Swift cache
        timeout-minutes: 18
        run: |
          {
            command -v curl
            curl --version
          } > diagnostics/curl-version.txt
          cache="$(mktemp -d "$RUNNER_TEMP/swiftpm-cache.XXXXXX")"
          printf 'SWIFT_PACKAGE_CACHE=%s\n' "$cache" >> "$GITHUB_ENV"
          python3 tools/macos/provision_swift_cache.py --package-path tools/macos/launcher \
            --cache-path "$cache" --diagnostics diagnostics/package-cache
      - name: Acquire pinned Swift dependencies before testing
        timeout-minutes: 18
        run: |
          python3 tools/macos/resolve_packages.py --package-path tools/macos/launcher --diagnostics diagnostics/package-resolution \
            --cache-path "$SWIFT_PACKAGE_CACHE"
          git diff --exit-code -- tools/macos/launcher/Package.swift tools/macos/launcher/Package.resolved
      - name: Reproduce placement failures with the unchanged installer
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import signal
          import subprocess
          import xml.etree.ElementTree as ET
          from tools.required_test_report import inventory, report, swift_outcomes

          package = Path("tools/macos/launcher")
          cache = os.environ["SWIFT_PACKAGE_CACHE"]
          production = package / "Sources/AnyPS5Core/Installer.swift"
          fixture = package / "Tests/AnyPS5CoreTests/PlaceTests.swift"
          baseline = os.environ["PLACEMENT_BASELINE_REVISION"]
          candidate = production.read_bytes()
          previous = subprocess.check_output(["git", "show", baseline + ":" + str(production)])
          expected = {
              "testTheGameLivesOutsideTheBundle": [],
              "testLinksStayShortUnderPrivate": [],
              "testAnOldBundleKeepsItsSavesAndMovesOut": [],
              "testUnlockingAgainKeepsSavesInTheDataFolder": [],
              "testFailedDataDestinationPreservesLegacySavesAfterCleanup": [
                  "failed placement must preserve the old executable",
                  "failed placement must preserve save bytes after partial cleanup"],
              "testFailedFinalMoveRestoresLegacyBundleAndSaves": [
                  "failed placement must preserve the old executable",
                  "failed placement must preserve save bytes after partial cleanup"],
              "testFailedFinalMoveRestoresExternalBundleAndSaves": [
                  "failed placement must preserve the old executable"],
              "testSuccessfulReinstallPreservesNestedAndParkedSaves": [],
              "testFailedFirstInstallLeavesNoGameAndCanRetry": [
                  "failed first install must not leave an unowned game directory"],
          }
          expected = {"AnyPS5CoreTests.PlaceTests/" + name: markers for name, markers in expected.items()}
          evidence = {"baseline_revision": baseline, "candidate_revision": os.environ["GITHUB_SHA"],
                      "baseline_installer_sha256": hashlib.sha256(previous).hexdigest(),
                      "candidate_installer_sha256": hashlib.sha256(candidate).hexdigest(),
                      "fixture_sha256": hashlib.sha256(fixture.read_bytes()).hexdigest(),
                      "commands": [], "expected_baseline_reproduced": False}
          evidence_path = Path("diagnostics/placement-baseline.json")
          def save():
              evidence_path.write_text(json.dumps(evidence, indent=2) + "\n", encoding="utf-8")
          def run(command, output, timeout):
              with open(output, "w", encoding="utf-8") as stream:
                  process = subprocess.Popen(command, stdout=stream, stderr=subprocess.STDOUT, start_new_session=True)
                  timed_out = False
                  try:
                      process.wait(timeout=timeout)
                  except subprocess.TimeoutExpired:
                      timed_out = True
                      os.killpg(process.pid, signal.SIGKILL)
                      process.wait(timeout=10)
              evidence["commands"].append({"command": command, "log": output,
                                           "exit_code": process.returncode, "timed_out": timed_out})
              save()
              if timed_out:
                  raise SystemExit("the installer baseline must finish normally")
              return process.returncode
          save()
          try:
              production.write_bytes(previous)
              if production.read_bytes() != previous or candidate == previous:
                  raise SystemExit("the placement comparison requires distinct unchanged and repaired implementations")
              if run(["swift", "test", "--package-path", str(package), "--cache-path", cache, "--jobs", "2", "list"],
                     "diagnostics/placement-baseline-inventory.txt", 1800) != 0:
                  raise SystemExit("the unchanged installer must build with the identical fixture")
              code = run(["swift", "test", "--package-path", str(package), "--cache-path", cache, "--skip-build", "--verbose",
                          "--parallel", "--num-workers", "1", "--filter", r"^AnyPS5CoreTests\.PlaceTests/",
                          "--xunit-output", str(Path("diagnostics/placement-baseline.xml").resolve())],
                         "diagnostics/placement-baseline.log", 120)
              if code != 1:
                  raise SystemExit("the unchanged installer must return its ordinary XCTest failure exit code")
          finally:
              production.write_bytes(candidate)
              evidence["candidate_restored"] = production.read_bytes() == candidate
              save()
          names = inventory(Path("diagnostics/placement-baseline-inventory.txt"), "swift")
          registered = {name for name in names if name.startswith("AnyPS5CoreTests.PlaceTests/")}
          data = report(Path("diagnostics/placement-baseline-inventory.txt"), Path("diagnostics/placement-baseline.xml"),
                        "swift", [re.escape(name) for name in expected], log_path=Path("diagnostics/placement-baseline.log"))
          outcomes = swift_outcomes(Path("diagnostics/placement-baseline.log"), names)
          text = Path("diagnostics/placement-baseline.log").read_text(encoding="utf-8")
          blocks = list(re.finditer(r"Test Case '([^']+)' started\.(.*?)Test Case '\1' (passed|failed|skipped) \(", text, re.S))
          checks = {}
          for name, markers in expected.items():
              method = name.split("/", 1)[1]
              identities = {name.replace("/", "."), "-[" + name.replace("/", " ") + "]",
                            "PlaceTests." + method, "-[PlaceTests " + method + "]"}
              matching = [block for block in blocks if block[1] in identities]
              status = "failed" if markers else "passed"
              checks[name] = (outcomes.get(name) == status and len(matching) == 1
                              and matching[0][3] == status and all(marker in matching[0][2] for marker in markers))
          required_errors = {"required test " + name + ": failed" for name, markers in expected.items() if markers}
          xml = ET.parse("diagnostics/placement-baseline.xml").getroot()
          assertions_only = (not any(node.tag in ("error", "skipped") for node in xml.iter())
                             and all(node.get("status") in (None, "run") for node in xml.iter("testcase"))
                             and all(node.get(key) in (None, "0") for node in xml.iter()
                                     if node.tag in ("testsuite", "testsuites") for key in ("errors", "skipped", "disabled")))
          reproduced = (registered == set(expected) and data["required"] == 9 and data["failed"] == 4
                        and data["passed"] == 5 and set(data["errors"]) == required_errors and all(checks.values()) and assertions_only)
          evidence.update({"report": data, "diagnostic_checks": checks, "assertions_only": assertions_only,
                           "expected_baseline_reproduced": reproduced})
          save()
          if not reproduced:
              raise SystemExit("all four precise placement failures and five passing controls must be reproduced")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("### Unchanged installer baseline\n\nFour placement failures reproduced with their exact assertions; five controls passed. The candidate installer was restored before its build.\n")
          PY
          git diff --exit-code -- tools/macos/launcher/Sources/AnyPS5Core/Installer.swift
      - name: Reproduce the oversized issue title with unchanged source
        timeout-minutes: 32
        env:
          ISSUE_BASELINE_REVISION: 21f4b1130b8bfb181c5849b8e9d62ecffcb065c3
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import math
          import os
          from pathlib import Path
          import re
          import signal
          import subprocess
          import time
          import xml.etree.ElementTree as ET
          from tools.required_test_report import inventory, report, swift_outcomes

          package = Path("tools/macos/launcher")
          cache = os.environ["SWIFT_PACKAGE_CACHE"]
          production = package / "Sources/AnyPS5Core/IssueDraft.swift"
          fixture = package / "Tests/AnyPS5CoreTests/IssueDraftTests.swift"
          baseline = os.environ["ISSUE_BASELINE_REVISION"]
          revision = os.environ["GITHUB_SHA"]
          name = "AnyPS5CoreTests.IssueDraftTests/testOversizedGameNamesFinishWithBoundedLinks"
          marker = "issue draft child exceeded 10-second limit"
          expected_source = "ea2f14234e39c03aee29af9369000e25511195db7572b2c3f1be30bed4a31b87"
          if re.fullmatch(r"[0-9a-f]{40}", baseline) is None:
              raise SystemExit("the issue baseline must name an immutable commit")
          if subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() != revision:
              raise SystemExit("the issue comparison must use the triggering candidate revision")
          subprocess.run(["git", "merge-base", "--is-ancestor", baseline, revision], check=True)
          candidate = production.read_bytes()
          fixture_source = fixture.read_bytes()
          for path, content in ((production, candidate), (fixture, fixture_source)):
              if subprocess.check_output(["git", "show", revision + ":" + str(path)]) != content:
                  raise SystemExit("the issue comparison requires unchanged candidate source and fixture")
          previous = subprocess.check_output(["git", "show", baseline + ":" + str(production)])
          if hashlib.sha256(previous).hexdigest() != expected_source or previous == candidate:
              raise SystemExit("the issue comparison requires the exact unrepaired implementation")
          evidence = {"baseline_revision": baseline, "candidate_revision": revision,
                      "baseline_source_sha256": hashlib.sha256(previous).hexdigest(),
                      "candidate_source_sha256": hashlib.sha256(candidate).hexdigest(),
                      "fixture_sha256": hashlib.sha256(fixture_source).hexdigest(),
                      "commands": [], "expected_baseline_reproduced": False}
          evidence_path = Path("diagnostics/issue-title-baseline.json")
          def save():
              evidence_path.write_text(json.dumps(evidence, indent=2) + "\n", encoding="utf-8")
          def run(command, output, timeout):
              started = time.monotonic()
              with open(output, "w", encoding="utf-8") as stream:
                  process = subprocess.Popen(command, stdout=stream, stderr=subprocess.STDOUT, start_new_session=True)
                  timed_out = False
                  try:
                      process.wait(timeout=timeout)
                  except subprocess.TimeoutExpired:
                      timed_out = True
                      os.killpg(process.pid, signal.SIGKILL)
                      process.wait(timeout=10)
              evidence["commands"].append({"command": command, "log": output, "exit_code": process.returncode,
                                           "timed_out": timed_out, "seconds": time.monotonic() - started})
              save()
              if timed_out:
                  raise SystemExit("the issue baseline must finish with an ordinary XCTest assertion")
              return process.returncode
          save()
          try:
              production.write_bytes(previous)
              changed = subprocess.check_output(["git", "diff", "--name-only", "HEAD", "--", str(package)], text=True).splitlines()
              if production.read_bytes() != previous or changed != [str(production)]:
                  raise SystemExit("only the unchanged issue implementation may be substituted")
              if run(["swift", "test", "--package-path", str(package), "--cache-path", cache, "--jobs", "2", "list"],
                     "diagnostics/issue-title-baseline-inventory.txt", 1800) != 0:
                  raise SystemExit("the unchanged issue implementation must build with the candidate fixture")
              code = run(["swift", "test", "--package-path", str(package), "--cache-path", cache, "--skip-build", "--verbose",
                          "--parallel", "--num-workers", "1", "--filter", "^" + re.escape(name) + "$",
                          "--xunit-output", str(Path("diagnostics/issue-title-baseline.xml").resolve())],
                         "diagnostics/issue-title-baseline.log", 60)
              if code != 1:
                  raise SystemExit("the unchanged issue implementation must return its ordinary XCTest failure exit code")
          finally:
              try:
                  evidence["baseline_source_unchanged"] = production.read_bytes() == previous
              finally:
                  production.write_bytes(candidate)
                  evidence["candidate_restored"] = production.read_bytes() == candidate
                  evidence["fixture_unchanged"] = fixture.read_bytes() == fixture_source
                  save()
          if not all(evidence[key] for key in ("baseline_source_unchanged", "candidate_restored", "fixture_unchanged")):
              raise SystemExit("the issue source and fixture identities must survive the comparison")
          inventory_path = Path("diagnostics/issue-title-baseline-inventory.txt")
          log_path = Path("diagnostics/issue-title-baseline.log")
          junit_path = Path("diagnostics/issue-title-baseline.xml")
          names = inventory(inventory_path, "swift")
          data = report(inventory_path, junit_path, "swift", [re.escape(name)], log_path=log_path)
          outcomes = swift_outcomes(log_path, names)
          text = log_path.read_text(encoding="utf-8")
          blocks = list(re.finditer(r"Test Case '([^']+)' started\.(.*?)Test Case '\1' (passed|failed|skipped) \(", text, re.S))
          method = name.split("/", 1)[1]
          identities = {name.replace("/", "."), "-[" + name.replace("/", " ") + "]",
                        "IssueDraftTests." + method, "-[IssueDraftTests " + method + "]"}
          errors = [line for line in text.splitlines() if re.search(r"(^|\s)error:", line)]
          exact_failure = (len(blocks) == 1 and blocks[0][1] in identities and blocks[0][3] == "failed"
                           and len(errors) == 1 and marker in errors[0] and errors[0] in blocks[0][2]
                           and text.count(marker) == 1 and outcomes == {name: "failed"})
          xml = ET.parse(junit_path).getroot()
          cases = list(xml.iter("testcase"))
          assertions_only = (len(cases) == 1 and len(cases[0].findall("failure")) == 1
                             and not any(node.tag in ("error", "skipped") for node in xml.iter())
                             and all(node.get("status") in (None, "run") for node in cases)
                             and all(node.get(key) in (None, "0") for node in xml.iter()
                                     if node.tag in ("testsuite", "testsuites") for key in ("errors", "skipped", "disabled")))
          seconds = float(cases[0].get("time", "nan")) if len(cases) == 1 else float("nan")
          reproduced = (name in names and data["required"] == 1 and data["failed"] == 1 and data["passed"] == 0
                        and data["errors"] == ["required test " + name + ": failed"]
                        and exact_failure and assertions_only and math.isfinite(seconds) and 0 < seconds <= 30)
          evidence.update({"report": data, "exact_failure": exact_failure, "assertions_only": assertions_only,
                           "test_seconds": seconds if math.isfinite(seconds) else None, "expected_baseline_reproduced": reproduced})
          save()
          if not reproduced:
              raise SystemExit("only the exact bounded issue-title assertion may reproduce the baseline")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("### Unchanged issue title baseline\n\nThe oversized-title test reached its bounded child timeout and failed with its exact assertion. The candidate source and identical fixture were verified before the regular build.\n")
          PY
          git diff --exit-code -- tools/macos/launcher/Sources/AnyPS5Core/IssueDraft.swift tools/macos/launcher/Tests/AnyPS5CoreTests/IssueDraftTests.swift
      - name: Build the command-line installer and discover every Swift test
        run: |
          swift build --package-path tools/macos/launcher --cache-path "$SWIFT_PACKAGE_CACHE" --product anyps5-tool --jobs 2 2>&1 | tee diagnostics/swift-build.log
          lipo tools/macos/launcher/.build/debug/anyps5-tool -verify_arch arm64
          swift test --package-path tools/macos/launcher --cache-path "$SWIFT_PACKAGE_CACHE" --jobs 2 list > diagnostics/swift-inventory.txt 2> diagnostics/swift-discovery.log
      - name: Execute required engine installation and update suites
        run: |
          filter="^(AnyPS5CoreTests\.(${REQUIRED_SWIFT_SUITES// /|})|AnyPS5Tests\.(ReleaseSourcePanelTests|LanguageCheckTests))/"
          swift test --package-path tools/macos/launcher --cache-path "$SWIFT_PACKAGE_CACHE" --skip-build --verbose --parallel --num-workers 2 \
            --filter "$filter" --skip '^AnyPS5CoreTests\.EngineCheckoutTests/testAnEngineFromARealCheckoutsBuild$' \
            --xunit-output "$PWD/diagnostics/swift.xml" 2>&1 | tee diagnostics/swift-tests.log
      - name: Require every discovered case in every selected suite
        if: always()
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import sys

          command = [sys.executable, "tools/required_test_report.py", "--kind", "swift",
                     "--inventory", "diagnostics/swift-inventory.txt", "--junit", "diagnostics/swift.xml",
                     "--log", "diagnostics/swift-tests.log", "--output", "diagnostics/launcher-report.json"]
          for suite in os.environ["REQUIRED_SWIFT_SUITES"].split():
              method = r"/(?!testAnEngineFromARealCheckoutsBuild$)[^\s]+" if suite == "EngineCheckoutTests" else r"/[^\s]+"
              command.extend(["--require", r"AnyPS5CoreTests\." + re.escape(suite) + method])
          command.extend(["--require", r"AnyPS5Tests\.ReleaseSourcePanelTests/[^\s]+"])
          command.extend(["--require", r"AnyPS5Tests\.LanguageCheckTests/[^\s]+"])
          raise SystemExit(subprocess.run(command).returncode)
          PY
      - name: Build both release architectures of the launcher and installer
        run: |
          swift build --package-path tools/macos/launcher --cache-path "$SWIFT_PACKAGE_CACHE" -c release --arch arm64 --arch x86_64 --product AnyPS5 --jobs 2 \
            2>&1 | tee diagnostics/universal-launcher-build.log
          swift build --package-path tools/macos/launcher --cache-path "$SWIFT_PACKAGE_CACHE" -c release --arch arm64 --arch x86_64 --product anyps5-tool --jobs 2 \
            2>&1 | tee diagnostics/universal-tool-build.log
          products="$(swift build --package-path tools/macos/launcher --cache-path "$SWIFT_PACKAGE_CACHE" -c release --arch arm64 --arch x86_64 --show-bin-path)"
          printf '%s\n' "$products" > diagnostics/products-path.txt
          for binary in AnyPS5 anyps5-tool; do
            test -x "$products/$binary"
            lipo "$products/$binary" -verify_arch arm64 x86_64
            file "$products/$binary"
            shasum -a 256 "$products/$binary"
            otool -L "$products/$binary"
          done > diagnostics/universal-binaries.txt
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          products = Path("diagnostics/products-path.txt").read_text().strip()
          products = Path(products)
          report = {"revision": os.environ["GITHUB_SHA"], "products": str(products), "binaries": {}, "cli_runs": [], "passed": False}
          report_path = Path("diagnostics/universal-report.json")
          def save():
              report_path.write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          def inspect(path):
              entry = {"path": str(path), "resolved_path": str(path.resolve())}
              report["binaries"][str(path.relative_to(products))] = entry
              save()
              subprocess.run(["lipo", str(path), "-verify_arch", "arm64", "x86_64"], check=True)
              with path.open("rb") as stream:
                  digest = hashlib.file_digest(stream, "sha256").hexdigest()
              architectures = subprocess.check_output(["lipo", "-archs", str(path)], text=True).split()
              raw = subprocess.check_output(["dwarfdump", "--uuid", str(path)], text=True)
              entry.update({"sha256": digest, "architectures": architectures, "dwarfdump": raw})
              save()
              uuids = {}
              for line in raw.splitlines():
                  match = re.fullmatch(r"UUID: ([0-9A-Fa-f]{8}(?:-[0-9A-Fa-f]{4}){3}-[0-9A-Fa-f]{12}) \(([^)]+)\) .+", line)
                  if match is None or match[2] in uuids:
                      raise SystemExit(f"invalid or duplicate Mach-O UUID record: {path}: {line}")
                  uuids[match[2]] = match[1].lower()
              if set(uuids) != set(architectures) or not uuids:
                  raise SystemExit(f"each Mach-O architecture must have a build UUID: {path}")
              entry["uuids"] = uuids
              save()
              return uuids
          for name in ("AnyPS5", "anyps5-tool"):
              inspect(products / name)
          for name in ("WebRTC", "LiveKitWebRTC", "RustLiveKitUniFFI"):
              frameworks = sorted(set(path for pattern in (name + ".framework", "*/" + name + ".framework") for path in products.glob(pattern)))
              if not frameworks:
                  raise SystemExit(f"missing required runtime framework: {name}")
              identity = None
              for framework in frameworks:
                  uuids = inspect(framework / name)
                  if identity is not None and uuids != identity:
                      raise SystemExit(f"runtime framework copies have different build identities: {name}")
                  identity = uuids
          library = Path(os.environ["RUNNER_TEMP"]) / "empty-game-library"
          library.mkdir()
          for architecture in ("arm64", "x86_64"):
              command = ["arch", "-" + architecture, str(products / "anyps5-tool"), "scan", str(library)]
              result = subprocess.run(command, capture_output=True, text=True, timeout=20)
              report["cli_runs"].append({"architecture": architecture, "command": command,
                                         "exit_code": result.returncode, "stdout": result.stdout, "stderr": result.stderr})
              save()
              if result.returncode != 0 or result.stdout or result.stderr:
                  raise SystemExit(f"the {architecture} installer could not scan an empty library cleanly")
          report["passed"] = True
          save()
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("### Universal launcher build\n\nBoth arm64 and x86_64 are present in the launcher, installer and three required frameworks. The installer executed on both architectures. This does not validate a complete engine bundle or game execution.\n")
          PY
      - name: Upload delivery diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: macos-delivery-${{ github.sha }}-${{ github.run_attempt }}
          path: diagnostics/
          retention-days: 7
          if-no-files-found: error
