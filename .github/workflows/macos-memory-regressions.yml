name: macOS memory regressions

on:
  push:
    branches: ['codex/macos-*']
    paths:
      - .github/workflows/macos-memory-regressions.yml
      - .github/anytogether-ci/ctest-known-failures.txt
      - CMakeLists.txt
      - cmake/**
      - .gitmodules
      - 3rdparty/**
      - core/libs/CMakeLists.txt
      - core/libs/prx/libc/**
      - core/libs/prx/libkernel/**
      - core/libs/tests/GuestMemory*.cpp
      - core/libs/tests/GuestDirectMemory*.cpp
      - core/libs/tests/GuestFixedMappingValidation.cpp
      - core/libs/tests/GuestFileMappingValidation.cpp
      - core/libs/prx/libSceAgcDriver/**
      - core/shader/recompiler/**
      - tools/required_test_report.py
      - tools/macos/fetch_ffmpeg.py
      - tools/tests/test_ffmpeg_fetch.py
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: macos-memory-regressions-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  memory-regressions:
    name: Required macOS memory and CPU write-tracking tests
    runs-on: macos-26
    timeout-minutes: 75
    env:
      BASELINE_REVISION: 861424137e7b0b801fa1f86958b486292a268a89
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      REQUIRED_TESTS: '^(guest_memory|guest_mmap_fixed_anonymous|guest_direct_memory_lifecycle|guest_direct_memory_for_app|guest_direct_memory_executable_(transition|aliases|partial_release|replacement|rejections)|guest_fixed_mapping_validation_(direct_flags_covered|direct_flags_overlap|direct_alignment_covered|direct_alignment_overlap|flexible_flags_covered|flexible_flags_overlap|direct_protection_overlap|flexible_protection_overlap|reserve_alignment|controls)|guest_file_mapping_validation_(shared_covered|shared_overlap|private_covered|private_overlap|controls)|agc_write_tracking|agc_write_tracking_generation_wrap)$'
    steps:
      - name: Check out tested revision and pinned submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          filter: blob:none
          submodules: recursive
          persist-credentials: false
      - name: Record source and machine identity
        run: |
          mkdir -p diagnostics
          {
            git rev-parse HEAD
            git submodule status --recursive
            sw_vers
            uname -a
            sysctl hw.model hw.memsize hw.ncpu machdep.cpu.brand_string
            xcodebuild -version
            xcrun clang --version
            cmake --version
            python3 --version
            printf 'Coverage: CPU memory mappings and AGC write tracking; no GPU execution\n'
          } > diagnostics/identity.txt
          cp .github/anytogether-ci/ctest-known-failures.txt diagnostics/known-failures.txt
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(uname -m)" = arm64
      - name: Install Rosetta and Ninja
        run: |
          sudo softwareupdate --install-rosetta --agree-to-license 2>&1 | tee diagnostics/rosetta.log
          brew install ninja 2>&1 | tee diagnostics/ninja.log
          arch -x86_64 uname -m | tee diagnostics/rosetta-architecture.txt
          test "$(arch -x86_64 uname -m)" = x86_64
      - name: Acquire and verify the pinned FFmpeg package
        timeout-minutes: 6
        run: |
          python3 tools/macos/fetch_ffmpeg.py --repo . --architecture x64 \
            --destination "$RUNNER_TEMP/ffmpeg-x64" --report diagnostics/ffmpeg-acquisition.json
      - name: Prepare the unchanged baseline with the identical file-mapping fixture
        run: |
          git worktree add --detach "$RUNNER_TEMP/file-memory-baseline" "$BASELINE_REVISION"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess

          candidate = Path.cwd()
          baseline = Path(os.environ["RUNNER_TEMP"]) / "file-memory-baseline"
          revision = os.environ["BASELINE_REVISION"]
          def git(*args, cwd=candidate):
              return subprocess.check_output(["git", *args], cwd=cwd, text=True).strip()
          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          if git("rev-parse", "HEAD", cwd=baseline) != revision:
              raise SystemExit("baseline worktree is not at the required revision")
          for path in ("3rdparty", ".gitmodules"):
              if git("rev-parse", f"{revision}:{path}") != git("rev-parse", f"HEAD:{path}"):
                  raise SystemExit(f"baseline dependencies differ: {path}")
          dependencies = {}
          for entry in git("ls-tree", "-r", revision, "--", "3rdparty").splitlines():
              metadata, path = entry.split("\t", 1)
              mode, kind, sha = metadata.split()
              if mode != "160000":
                  continue
              source = candidate / path
              if kind != "commit" or git("rev-parse", "HEAD", cwd=source) != sha:
                  raise SystemExit(f"candidate submodule is not at its pinned revision: {path}")
              destination = baseline / path
              if destination.exists():
                  destination.rmdir()
              destination.symlink_to(source, target_is_directory=True)
              dependencies[path] = sha
          if not dependencies:
              raise SystemExit("no pinned submodules were verified")
          fixture = "core/libs/tests/GuestFileMappingValidation.cpp"
          registration = "core/libs/prx/libkernel/CMakeLists.txt"
          for path in (fixture, registration):
              shutil.copy2(candidate / path, baseline / path)
          production = "core/libs/prx/libkernel/DirectMemory/PosixMemory.cpp"
          if git("hash-object", production, cwd=baseline) != git("rev-parse", f"{revision}:{production}"):
              raise SystemExit("baseline POSIX memory implementation was modified")
          data = {"baseline_revision": revision, "candidate_revision": os.environ["GITHUB_SHA"],
                  "fixture_sha256": digest(candidate / fixture),
                  "baseline_fixture_sha256": digest(baseline / fixture),
                  "baseline_production_sha256": digest(baseline / production),
                  "candidate_production_sha256": digest(candidate / production),
                  "submodules": dependencies}
          if data["fixture_sha256"] != data["baseline_fixture_sha256"]:
              raise SystemExit("the paired file-mapping fixtures differ")
          Path("diagnostics/baseline-provenance.json").write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY
          git diff "$BASELINE_REVISION" -- core/libs/prx/libkernel/DirectMemory/PosixMemory.cpp > diagnostics/posix-memory.patch
      - name: Build the unchanged baseline runtime and file-mapping fixture
        run: |
          baseline="$RUNNER_TEMP/file-memory-baseline"
          cmake -S "$baseline" -B "$baseline/build-memory" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DFFMPEG_PREBUILT_DIR:PATH="$RUNNER_TEMP/ffmpeg-x64" \
            -DPython3_EXECUTABLE="$(command -v python3)" 2>&1 | tee diagnostics/baseline-configure.log
          grep -Fx "FFMPEG_PREBUILT_DIR:PATH=$RUNNER_TEMP/ffmpeg-x64" "$baseline/build-memory/CMakeCache.txt"
          cmake --build "$baseline/build-memory" --parallel 2 --target guest_file_mapping_validation_tests \
            2>&1 | tee diagnostics/baseline-build.log
          file "$baseline/build-memory/tests/guest_file_mapping_validation_tests" > diagnostics/baseline-binary.txt
          lipo "$baseline/build-memory/tests/guest_file_mapping_validation_tests" -verify_arch x86_64
          shasum -a 256 "$baseline/build-memory/tests/guest_file_mapping_validation_tests" \
            "$baseline/build-memory/core/libs/libs/unpatched/libc.prx" \
            "$baseline/build-memory/core/libs/libs/unpatched/libkernel.prx" > diagnostics/baseline-runtime-sha256.txt
      - name: Reproduce every baseline file-mapping failure and require the control to pass
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import signal
          import subprocess

          binary = Path(os.environ["RUNNER_TEMP"]) / "file-memory-baseline/build-memory/tests/guest_file_mapping_validation_tests"
          expectations = {
              "shared_covered": "rejected file mapping changed original mapping metadata",
              "shared_overlap": "rejected file mapping changed original mapping metadata",
              "private_covered": "rejected file mapping changed original mapping metadata",
              "private_overlap": "rejected file mapping changed original mapping metadata",
              "controls": None,
          }
          cases = []
          for name, failure in expectations.items():
              command = [str(binary), name]
              process = subprocess.Popen(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                         text=True, start_new_session=True)
              timed_out = False
              try:
                  output, _ = process.communicate(timeout=30)
              except subprocess.TimeoutExpired:
                  timed_out = True
                  os.killpg(process.pid, signal.SIGKILL)
                  output, _ = process.communicate(timeout=2)
              Path(f"diagnostics/baseline-{name}.log").write_text(output, encoding="utf-8")
              marker = f"file mapping validation failed [{name}]: {failure}" if failure else f"file mapping validation {name} passed"
              expected_exit = 1 if failure else 0
              matched = not timed_out and process.returncode == expected_exit and marker in output.splitlines()
              cases.append({"test": name, "command": command, "exit_code": process.returncode,
                            "expected_exit_code": expected_exit, "timed_out": timed_out,
                            "matched_expectation": matched, "required_diagnostic": marker})
              print(f"baseline {name}: exit={process.returncode}, expected={expected_exit}, matched={matched}")
              print(output)
          reproduced = len(cases) == 5 and all(case["matched_expectation"] for case in cases)
          data = {"baseline_revision": os.environ["BASELINE_REVISION"], "candidate_revision": os.environ["GITHUB_SHA"],
                  "expected_failures": 4, "expected_passes": 1, "cases": cases,
                  "expected_baseline_reproduced": reproduced}
          Path("diagnostics/baseline-report.json").write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("### Unchanged file-mapping baseline\n\nFour specific file-mapping failures reproduced and the control passed: " + str(reproduced) + "\n")
          if not reproduced:
              raise SystemExit("the baseline must complete all five cases with exactly the required diagnostics and exit codes")
          PY
      - name: Configure the x86-64 runtime and test inventory
        run: |
          cmake -S . -B build-memory -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DFFMPEG_PREBUILT_DIR:PATH="$RUNNER_TEMP/ffmpeg-x64" \
            -DPython3_EXECUTABLE="$(command -v python3)" 2>&1 | tee diagnostics/configure.log
          grep -Fx "FFMPEG_PREBUILT_DIR:PATH=$RUNNER_TEMP/ffmpeg-x64" build-memory/CMakeCache.txt
          ctest --test-dir build-memory --show-only=json-v1 --no-tests=error > diagnostics/inventory.json
      - name: Build the required memory fixtures
        run: |
          cmake --build build-memory --parallel 2 --target guest_memory_tests \
            guest_direct_memory_lifecycle_tests guest_direct_memory_for_app_tests \
            guest_direct_memory_executable_tests guest_fixed_mapping_validation_tests guest_file_mapping_validation_tests agc_write_tracking_tests 2>&1 | tee diagnostics/build.log
          for binary in guest_memory_tests guest_direct_memory_lifecycle_tests guest_direct_memory_for_app_tests guest_direct_memory_executable_tests guest_fixed_mapping_validation_tests guest_file_mapping_validation_tests agc_write_tracking_tests; do
            file "build-memory/tests/$binary"
            lipo "build-memory/tests/$binary" -verify_arch x86_64
            shasum -a 256 "build-memory/tests/$binary"
          done > diagnostics/binaries.txt
          shasum -a 256 build-memory/core/libs/libs/unpatched/libc.prx \
            build-memory/core/libs/libs/unpatched/libkernel.prx > diagnostics/runtime-sha256.txt
      - name: Execute the selected regressions without retries or exclusions
        run: |
          ctest --test-dir build-memory -R "$REQUIRED_TESTS" -V --timeout 30 --parallel 1 \
            --no-tests=error --output-junit "$PWD/diagnostics/ctest.xml" 2>&1 | tee diagnostics/ctest.log
      - name: Require every selected test to report a pass
        if: always()
        run: |
          python3 tools/required_test_report.py --inventory diagnostics/inventory.json \
            --junit diagnostics/ctest.xml --output diagnostics/report.json \
            --known-failures .github/anytogether-ci/ctest-known-failures.txt \
            --require guest_memory --require guest_mmap_fixed_anonymous \
            --require guest_direct_memory_lifecycle --require guest_direct_memory_for_app \
            --require guest_direct_memory_executable_transition --require guest_direct_memory_executable_aliases \
            --require guest_direct_memory_executable_partial_release --require guest_direct_memory_executable_replacement \
            --require guest_direct_memory_executable_rejections \
            --require guest_fixed_mapping_validation_direct_flags_covered \
            --require guest_fixed_mapping_validation_direct_flags_overlap \
            --require guest_fixed_mapping_validation_direct_alignment_covered \
            --require guest_fixed_mapping_validation_direct_alignment_overlap \
            --require guest_fixed_mapping_validation_flexible_flags_covered \
            --require guest_fixed_mapping_validation_flexible_flags_overlap \
            --require guest_fixed_mapping_validation_direct_protection_overlap \
            --require guest_fixed_mapping_validation_flexible_protection_overlap \
            --require guest_fixed_mapping_validation_reserve_alignment \
            --require guest_fixed_mapping_validation_controls \
            --require guest_file_mapping_validation_shared_covered \
            --require guest_file_mapping_validation_shared_overlap \
            --require guest_file_mapping_validation_private_covered \
            --require guest_file_mapping_validation_private_overlap \
            --require guest_file_mapping_validation_controls \
            --require agc_write_tracking --require agc_write_tracking_generation_wrap
      - name: Upload memory regression diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: macos-memory-regressions-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            diagnostics/
            build-memory/CMakeCache.txt
            build-memory/CMakeFiles/CMakeConfigureLog.yaml
            build-memory/Testing/Temporary/
            ${{ runner.temp }}/file-memory-baseline/build-memory/CMakeCache.txt
            ${{ runner.temp }}/file-memory-baseline/build-memory/CMakeFiles/CMakeConfigureLog.yaml
          retention-days: 7
          if-no-files-found: error
